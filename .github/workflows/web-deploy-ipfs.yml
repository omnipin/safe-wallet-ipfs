name: Safe-Wallet-Monorepo Web Release on IPFS (Always Deploy Latest)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Latest Safe Frontend to IPFS

    permissions:
      contents: write
      checks: write
      pull-requests: write
      statuses: write

    steps:
      - name: Get latest release info
        id: latest_release_info
        run: |
          RELEASE_INFO=$(curl -sSf https://api.github.com/repos/safe-global/safe-wallet-monorepo/releases/latest)
          TAG_NAME=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          TAR_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url')
          CHECKSUM_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith("-sha256-checksum.txt")) | .browser_download_url')
          echo "latest_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "tar_url=$TAR_URL" >> $GITHUB_OUTPUT
          echo "checksum_url=$CHECKSUM_URL" >> $GITHUB_OUTPUT

      - name: Download Release Tarball + Checksum
        run: |
          curl -L "${{ steps.latest_release_info.outputs.tar_url }}" -o /tmp/release.tar.gz
          curl -L "${{ steps.latest_release_info.outputs.checksum_url }}" -o /tmp/checksum.txt

      - name: Verify Checksum
        run: |
          EXPECTED=$(awk '{print $1}' /tmp/checksum.txt)
          ACTUAL=$(sha256sum /tmp/release.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || (echo "Checksum mismatch!" && exit 1)

      - name: Extract Tarball
        run: |
          mkdir -p /tmp/release
          tar -xzf /tmp/release.tar.gz -C /tmp/release

      - name: Verify build directory
        run: |
          if [ ! -d "/tmp/release/out" ]; then
            echo "❌ Build directory not found"
            find /tmp/release -type d | head -20
            exit 1
          fi

          if [ ! -f "/tmp/release/out/index.html" ]; then
            echo "❌ index.html not found in build directory"
            ls -la "/tmp/release/out" | head -10
            exit 1
          fi

          echo "✅ Build directory verified"

      - name: Deploy to Filecoin via Omnipin (using relative paths)
        id: deploy_ipfs
        run: |
          cd /tmp/release/out
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la | head -10

          # Deploy from current directory using relative path
          output=$(npx omnipin deploy . --filecoin-chain calibration --ens safe.filpay.eth --safe 0xFF7C0D6234e3fAeea4c8Ba647c3C99157AFf7028 --strict)
          echo "$output"
          cid=$(echo "$output" | awk '/Root CID:/ {print $NF}')
          [ -n "$cid" ] || (echo "CID not found!" && exit 1)
          echo "cid=$cid" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_STEP_SUMMARY
        env:
          OMNIPIN_FILECOIN_TOKEN: ${{ secrets.OMNIPIN_FILECOIN_TOKEN }}
          OMNIPIN_FILECOIN_SP_URL: "https://calibnet.pspsps.io"
          OMNIPIN_FILECOIN_SP_ADDRESS: "0x682467D59F5679cB0BF13115d4C94550b8218CF2"
          OMNIPIN_PK: ${{ secrets.OMNIPIN_PK }}

      - name: Create Release in This Repo
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.latest_release_info.outputs.latest_tag }}
          release_name: safe-wallet-monorepo ${{ steps.latest_release_info.outputs.latest_tag }}
          body: |
            - 🧩 Version: `${{ steps.latest_release_info.outputs.latest_tag }}`
            - 📦 Source: https://github.com/safe-global/safe-wallet-monorepo/releases/tag/${{ steps.latest_release_info.outputs.latest_tag }}
            - 🔏 CID: `${{ steps.deploy_ipfs.outputs.cid }}`
            - 🌍 Gateways:
              - https://${{ steps.deploy_ipfs.outputs.cid }}.ipfs.dweb.link/
              - https://${{ steps.deploy_ipfs.outputs.cid }}.ipfs.w3s.link/
              - https://${{ steps.deploy_ipfs.outputs.cid }}.ipfs.inbrowser.link/

      - name: Cleanup
        run: rm -rf /tmp/release /tmp/checksum.txt /tmp/release.tar.gz
